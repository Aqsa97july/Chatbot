<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0f1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .chat-container {
            width: 400px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #2a2d3e;
            display: flex;
            flex-direction: column;
            height: 540px;
            background: #1a1d2e;
        }

        .chat-header {
            background: #3b5bdb;
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #69db7c;
            display: inline-block;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb { background: #2a2d3e; border-radius: 4px; }

        .bot-message, .user-message {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            max-width: 78%;
            word-wrap: break-word;
        }

        .bot-message {
            background: #2a2d3e;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .user-message {
            background: #3b5bdb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .typing {
            background: #2a2d3e;
            color: #888;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 20px;
            letter-spacing: 3px;
        }

        .input-section {
            display: flex;
            gap: 8px;
            padding: 14px 16px;
            border-top: 1px solid #2a2d3e;
            background: #1a1d2e;
        }

        .input-section input {
            flex: 1;
            background: #2a2d3e;
            border: 1px solid #3a3d4e;
            border-radius: 10px;
            padding: 10px 14px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-section input:focus {
            border-color: #3b5bdb;
        }

        .input-section input::placeholder { color: #666; }

        .input-section button {
            background: #3b5bdb;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-section button:hover { background: #2f4ac7; }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .chip {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #3b5bdb;
            color: #7a9cff;
            background: transparent;
            cursor: pointer;
            transition: background 0.15s;
        }

        .chip:hover { background: #2a2d3e; }

        .ended {
            text-align: center;
            font-size: 12px;
            color: #555;
            padding: 6px 0;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">AI Chatbot</div>
    <div class="chat-box" id="chatBox">
        <div class="bot-message">Hello! How can I help you today?</div>
        <div class="chips">
            <div class="chip" onclick="sendChip('hi')">👋 hi</div>
            <div class="chip" onclick="sendChip('get_weather')">🌤 get_weather</div>
            <div class="chip" onclick="sendChip('thanks')">🙏 thanks</div>
            <div class="chip" onclick="sendChip('farewell')">farewell</div>
        </div>
    </div>
    <div class="input-section" id="inputSection">
        <input type="text" id="userInput" placeholder="Type your message..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // same logic as your C++ code
    const rules = {
        "hi":          { reply: "Hello! How can I help you today? 😊", chips: ["get_weather","thanks","farewell","by"] },
        "get_weather": { reply: "I can't check the weather yet, but you can use a weather app like Google Weather! ☁️", chips: ["thanks","hi","farewell"] },
        "thanks":      { reply: "You're welcome! Happy to help anytime. 😊", chips: ["hi","get_weather","farewell"] },
        "unknown":     { reply: "Sorry, I didn't understand that.", chips: ["hi","get_weather","thanks","farewell"] },
        "farewell":    { reply: "Goodbye! Have a great day! 👋", chips: [], end: true },
        "by":          { reply: "Have a nice day! 👋", chips: [], end: true },
    };

    const chipLabels = {
        hi: "👋 hi", get_weather: "🌤 get_weather",
        thanks: "🙏 thanks", farewell: "farewell", by: "🚪 by"
    };

    function trim(s) { return s.replace(/^\s+|\s+$/g, ''); }
    function toLowerCase(s) { return s.toLowerCase(); }

    function getReply(raw) {
        const input = toLowerCase(trim(raw));
        return rules[input] || { reply: "Please enter a valid command. Try: hi, get_weather, thanks, farewell, or by.", chips: ["hi","get_weather","thanks","farewell"] };
    }

    function addMessage(text, isUser) {
        const box = document.getElementById('chatBox');
        // remove old chips
        const oldChips = box.querySelector('.chips');
        if (oldChips) oldChips.remove();

        const msg = document.createElement('div');
        msg.className = isUser ? 'user-message' : 'bot-message';
        msg.textContent = text;
        box.appendChild(msg);
        box.scrollTop = box.scrollHeight;
    }

    function addChips(chipList) {
        if (!chipList || chipList.length === 0) return;
        const box = document.getElementById('chatBox');
        const wrap = document.createElement('div');
        wrap.className = 'chips';
        chipList.forEach(c => {
            const btn = document.createElement('div');
            btn.className = 'chip';
            btn.textContent = chipLabels[c] || c;
            btn.onclick = () => sendChip(c);
            wrap.appendChild(btn);
        });
        box.appendChild(wrap);
        box.scrollTop = box.scrollHeight;
    }

    function showTyping() {
        const box = document.getElementById('chatBox');
        const t = document.createElement('div');
        t.className = 'typing'; t.id = 'typing'; t.textContent = '...';
        box.appendChild(t);
        box.scrollTop = box.scrollHeight;
    }

    function removeTyping() {
        const t = document.getElementById('typing');
        if (t) t.remove();
    }

    function endChat() {
        const box = document.getElementById('chatBox');
        const ended = document.createElement('div');
        ended.className = 'ended';
        ended.textContent = '— Chat ended —';
        box.appendChild(ended);
        document.getElementById('inputSection').innerHTML =
            '<p style="color:#555; font-size:13px; text-align:center; width:100%; padding:8px 0;">Refresh the page to start again.</p>';
    }

    function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        addMessage(text, true);
        showTyping();
        setTimeout(() => {
            removeTyping();
            const result = getReply(text);
            addMessage(result.reply, false);
            if (result.end) { endChat(); return; }
            addChips(result.chips);
        }, 700);
    }

    function sendChip(text) {
        document.getElementById('userInput').value = text;
        sendMessage();
    }
</script>

</body>
</html>
